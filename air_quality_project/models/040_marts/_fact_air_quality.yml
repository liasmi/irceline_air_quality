version: 2

models:
  - name: fact_air_quality
    description: "Fact table containing air quality measurements with linked dimensions"
    columns:
      - name: measurement_id
        description: "Unique identifier for measurement"
        tests:
          - unique
          - not_null
      - name: timestamp
        description: "Timestamp of the measurement"
        tests:
          - not_null
      - name: station_id
        description: "Reference to the station"
        tests:
          - not_null
          - relationships:
              to: ref('dim_station')
              field: station_id
      - name: phenomenon_id
        description: "Reference to the phenomenon/pollutant"
        tests:
          - not_null
          - relationships:
              to: ref('dim_pollutant')
              field: phenomenon_id
      - name: measurement_value
        description: "The air quality measurement value"
        tests:
          - not_null
          - measurement_value_in_range:
              min_value: 0
              max_value: 500
